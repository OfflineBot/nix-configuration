# ============================================================
#  Kitty config — Dracula color scheme
#  https://draculatheme.com
# ============================================================

# --- general -------------------------------------------------
window_margin_width      4
confirm_os_window_close  0
allow_remote_control     yes
background_opacity       0.80
enable_input_method      yes
enable_audio_bell        no

# --- font ----------------------------------------------------
font_family              FiraCode Nerd Font
font_size                11
bold_font                auto
italic_font              auto
bold_italic_font         auto

# ============================================================
#  Dracula palette
# ============================================================

# --- base ----------------------------------------------------
foreground               #f8f8f2
background               #282a36

# --- cursor --------------------------------------------------
cursor                   #f8f8f2
cursor_text_color        background

# --- selection -----------------------------------------------
selection_foreground     #ffffff
selection_background     #44475a

# --- url / bell ----------------------------------------------
url_color                #8be9fd
visual_bell_color        #ff79c6
bell_border_color        #ff79c6

# --- window borders ------------------------------------------
active_border_color      #bd93f9
inactive_border_color    #44475a

# --- tab bar -------------------------------------------------
active_tab_foreground    #282a36
active_tab_background    #bd93f9
inactive_tab_foreground  #6272a4
inactive_tab_background  #282a36

# ============================================================
#  ANSI colors (16-color terminal palette)
# ============================================================

# black
color0                   #21222c
color8                   #6272a4

# red
color1                   #ff5555
color9                   #ff6e6e

# green
color2                   #50fa7b
color10                  #69ff94

# yellow
color3                   #f1fa8c
color11                  #ffffa5

# blue (Dracula purple)
color4                   #bd93f9
color12                  #d6acff

# magenta (Dracula pink)
color5                   #ff79c6
color13                  #ff92df

# cyan
color6                   #8be9fd
color14                  #a4ffff

# white
color7                   #f8f8f2
color15                  #ffffff
