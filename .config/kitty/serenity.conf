# ============================================================
#  Kitty config — Serenity color scheme
#  Based on Pantone "Serenity" (#91A8D0) & "Rose Quartz" (#F7CAC9)
# ============================================================

# --- general -------------------------------------------------
window_margin_width      4
confirm_os_window_close  0
allow_remote_control     yes
background_opacity       0.96
enable_input_method      yes
enable_audio_bell        no

# --- font ----------------------------------------------------
font_family              FiraCode Nerd Font
font_size                11
bold_font                auto
italic_font              auto
bold_italic_font         auto

# ============================================================
#  Serenity palette
# ============================================================

# --- base ----------------------------------------------------
foreground               #d5dde8
background               #1c2b3a

# --- cursor --------------------------------------------------
cursor                   #91a8d0
cursor_text_color        background

# --- selection -----------------------------------------------
selection_foreground     #1c2b3a
selection_background     #b3cee5

# --- url / bell ----------------------------------------------
url_color                #b3cee5
visual_bell_color        #f7cac9
bell_border_color        #f7cac9

# --- window borders ------------------------------------------
active_border_color      #91a8d0
inactive_border_color    #3d5375

# --- tab bar -------------------------------------------------
active_tab_foreground    #f0f3f8
active_tab_background    #4a6b92
inactive_tab_foreground  #8fa3be
inactive_tab_background  #243446

# ============================================================
#  ANSI colors (16-color terminal palette)
# ============================================================

# black (deep slate / lighter slate)
color0                   #2a3950
color8                   #4a5b78

# red (muted rose / rose quartz)
color1                   #d8909a
color9                   #f7cac9

# green (sage / mint)
color2                   #95b894
color10                  #b5d4a8

# yellow (warm sand / light sand)
color3                   #d4b97a
color11                  #e8d49a

# blue (Pantone Serenity / light Serenity)
color4                   #91a8d0
color12                  #b3cee5

# purple (lavender / light lavender)
color5                   #b69ace
color13                  #d4bce6

# aqua (soft aqua / light aqua)
color6                   #8fbed1
color14                  #b3dce8

# white (light fg / bright fg)
color7                   #c9d6e8
color15                  #f0f3f8
